compatibility_date = "2025-07-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "aitextcoach-db"
database_id = "6326c54b-ecd0-4c93-be67-e8d2cfa0673d"

# KV for budget control and session state
[[kv_namespaces]]
